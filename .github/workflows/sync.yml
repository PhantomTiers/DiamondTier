name: Sync players

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the player list
        run: python3 scripts/sync.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain public/players.json)" ]; then
            git config user.name "diamondtier-sync"
            git config user.email "sync@users.noreply.github.com"
            git add public/players.json
            git commit -m "Sync players"
            git push
          fi
