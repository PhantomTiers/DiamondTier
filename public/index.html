<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DiamondTier — Minecraft PvP Tier List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Rajdhani:wght@600;700&family=Russo+One&display=swap">
<style>
:root{
  --bg1:#1d2f6e;--bg2:#121f4d;--panel:#14204f;--card:#182659;--line:rgba(255,255,255,.14);--text:#eef1fb;--muted:#7f89a8;
  --cy:#46e6ff;--gold:#ffc61a;--iron:#c9ceda;--cu:#e08a4a;
  --px:"Rajdhani","Trebuchet MS",sans-serif;--b:"Manrope",system-ui,sans-serif;--logo:"Russo One","Impact",sans-serif;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font:500 15px/1.5 var(--b);background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%) fixed;overflow-x:hidden}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px 50px}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
button{font-family:inherit}

.nav{position:relative;height:72px;margin:14px 0 28px}
.nav .bar{position:absolute;inset:0;border:1px solid var(--line);border-radius:14px;background:rgba(22,36,86,.85)}
.nav .in{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:100%;padding:0 20px}
.nl{display:flex;gap:34px;padding-left:10px}.nr{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding-right:8px}
.lk{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font:700 19px var(--px);padding:24px 0;border-top:2px solid transparent;opacity:.85}
.lk.on{color:var(--cy);border-top-color:var(--cy);opacity:1}
.lk svg{width:18px;height:18px;fill:currentColor}
.logo{display:block;height:64px;margin:0;cursor:pointer;transition:transform .25s;filter:drop-shadow(0 0 14px rgba(70,230,255,.55))}
.logo:hover{transform:scale(1.03)}
.logo svg{display:block;height:100%;width:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:#1b2b66;color:var(--text);font:700 18px var(--px);cursor:pointer;transition:border-color .2s}
.chip:hover{border-color:rgba(70,230,255,.6)}
.chip b{color:var(--cy);font-weight:700}
.cta{display:inline-flex;align-items:center;justify-content:center;padding:18px 46px;line-height:1;min-width:190px;border-radius:12px;white-space:nowrap;border:0;color:#03131a;font:700 20px var(--px);text-decoration:none;background:linear-gradient(180deg,#7df3ff,#1fb6d4);box-shadow:0 0 18px rgba(70,230,255,.4);transition:filter .2s,transform .15s}
.cta:hover{filter:brightness(1.12)}.cta:active{transform:scale(.96)}

.search{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;border:1px solid var(--line);border-radius:12px;background:#111d4a;transition:border-color .2s}
.search:focus-within{border-color:rgba(70,230,255,.55)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:500 15px var(--b)}
.search input::placeholder{color:var(--muted)}

.tabs{align-items:stretch;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin:16px 0;padding:8px;border:1px solid var(--line);border-radius:18px;background:rgba(14,22,60,.55)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:13px 2px 13px;border:1px solid transparent;border-radius:14px;background:none;color:var(--muted);font:700 15px/1.1 var(--px);cursor:pointer;transition:color .25s,background .3s,border-color .3s,box-shadow .3s}
.tabs .ic{display:block;width:46px;height:46px;margin:0 auto}
.tabs .dd{display:block;width:100%;padding:4px 0;box-sizing:border-box;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1.2,.4,1),opacity .35s,margin .4s}
.tabs .dd .ic{transform:translateY(-26px) scale(.3);transition:transform .55s cubic-bezier(.3,1.7,.5,1) .08s}
.ic img,.ic-s img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.tabs .lb{display:block;max-width:100%;white-space:nowrap}
.tabs .ls{display:none}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,rgba(70,230,255,.2),rgba(70,230,255,.05));border-color:rgba(70,230,255,.55);box-shadow:0 0 26px rgba(70,230,255,.22),inset 0 0 18px rgba(70,230,255,.08)}
.tabs.open .dd{max-height:70px;opacity:1}
.tabs.open .dd .ic{transform:none;opacity:.55;filter:grayscale(.35);transition:transform .55s cubic-bezier(.3,1.7,.5,1),opacity .3s,filter .3s}
.tabs.open button:hover .dd .ic{opacity:.9;transform:translateY(-2px)}
.tabs button[aria-selected="true"] .dd .ic{opacity:1!important;filter:drop-shadow(0 0 3px rgba(70,230,255,.55))!important}
.tabs button[aria-selected="true"] .dd .ic{animation:bob 2.6s ease-in-out .7s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.ic-s{display:inline-block;width:28px;height:28px;vertical-align:middle}
.ttl .ic-s{width:34px;height:34px;margin-right:10px;margin-top:-6px;filter:drop-shadow(0 0 8px rgba(255,198,26,.5))}
.swap{animation:swapin .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes swapin{from{opacity:0;transform:translateY(14px) scale(.98)}}
.panel{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#1a2b63,var(--panel));padding:26px 14px 28px;overflow:hidden}
.ttl{margin:0 0 14px;text-align:center;font:700 31px/1.2 var(--b);color:var(--gold);text-shadow:0 0 22px rgba(255,198,26,.35)}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:370px}
.spark{position:absolute;inset:0;pointer-events:none}
.spark i{position:absolute;width:2px;height:2px;border-radius:50%;background:#ffe9a0;opacity:0;animation:tw var(--t) ease-in-out var(--w) infinite}
@keyframes tw{50%{opacity:.9}}
.star{position:absolute;width:130px;height:2px;pointer-events:none;z-index:0;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);box-shadow:0 0 10px 1px rgba(150,220,255,.7);transform-origin:100% 50%;opacity:0;animation:shoot 1.1s cubic-bezier(.4,.1,.6,1) forwards}
.star::after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #aee8ff}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(var(--a)) scaleX(.3)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--a)) scaleX(1)}}
.pose,.hd{position:relative;display:block}
.pose svg,.hd svg{width:100%;height:100%;display:block}
.pose canvas,.hd canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.pod .nm a{color:inherit;text-decoration:none}.pod .nm a:hover,.row .nm a:hover{text-decoration:underline}
.row .nm a{color:inherit;text-decoration:none}
.pod{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,#14204f 0%,#1b2b66 60%,var(--tint) 130%);animation:rise .7s cubic-bezier(.2,.9,.3,1) both;transition:transform .25s,box-shadow .25s}
.pod,.row{cursor:pointer}.pod:focus-visible,.row:focus-visible{outline:2px solid var(--cy)}
.pod:hover{transform:translateY(-8px);box-shadow:0 14px 40px color-mix(in srgb,var(--c) 28%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(60px)}}
.p1{--c:var(--gold);--tint:#6b5200;width:190px;height:330px;order:2;border-color:rgba(255,198,26,.35);animation-delay:.2s}
.p2{--c:var(--iron);--tint:#3a3f4c;width:170px;height:292px;order:1;animation-delay:.05s}
.p3{--c:var(--cu);--tint:#5a2a0c;width:150px;height:262px;order:3;animation-delay:.12s}
.pod .nm{width:100%;padding:12px 8px 0;text-align:center;font:700 25px var(--px);color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p2 .nm{color:#fff}
.fig{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:0;position:relative;z-index:1;animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4px)}}
.fig .av{image-rendering:pixelated;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.base{width:100%;padding:6px 0 10px;text-align:center;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 45%,transparent));margin-top:-2px}
.base .n{font:700 54px/1 var(--b);color:var(--c);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.p2 .base .n{color:#9aa0ad}
.base .pt{font:700 12px var(--b);color:rgba(255,255,255,.7)}
.rule{width:min(640px,80%);height:2px;margin:26px auto 16px;background:linear-gradient(90deg,transparent,rgba(160,190,255,.45),transparent)}

.list{max-width:560px;margin:0 auto;display:grid;gap:10px}
.row{display:grid;grid-template-columns:34px 38px 1fr auto;align-items:center;gap:12px;padding:8px 16px 8px 12px;border:1px solid var(--line);border-radius:10px;background:#192760;
  animation:up .45s cubic-bezier(.2,.9,.3,1) both;transition:border-color .2s,background .2s,transform .2s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.row:hover{border-color:rgba(70,230,255,.55);background:#223580;transform:scale(1.015)}
.rk{font:700 22px var(--b);color:var(--muted);text-align:center}
.row .hd{width:38px;height:38px;border-radius:8px;overflow:hidden}
.row .nm{text-align:center;font:700 16px var(--b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.row .rt s{text-decoration:none;color:var(--text)}
.row .rt s.tp{font-size:14px;font-weight:700;color:var(--cy)}
.tier{font:700 17px var(--px);color:var(--k)}
.t1{--k:var(--gold)}.t2{--k:var(--cy)}.t3{--k:#a99bff}.t4{--k:#7b93ff}.t5{--k:#9aa3b8}
.lt{opacity:.8}
.empty{padding:30px;text-align:center;color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:22px;flex-wrap:wrap}
.tog{display:flex;padding:4px;border:1px solid var(--line);border-radius:10px;background:#192760}
.tog button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:7px;font:700 11px var(--b);cursor:pointer;transition:all .2s}
.tog button[aria-pressed="true"]{background:#16200f;color:var(--cy);background:#0c2530;box-shadow:inset 0 0 0 1px rgba(70,230,255,.45)}
.more{background:none;border:0;color:var(--muted);font:500 16px var(--b);cursor:pointer;transition:color .2s}
.more:hover{color:var(--cy)}
small{display:block;margin-top:26px;text-align:center;color:var(--muted);font-size:12px}

@media (max-width:760px){
  html,body{overflow-x:hidden;max-width:100%}
  .lk .lfull{display:none}.lk .lshort{display:inline}.lk{white-space:nowrap}
  .wrap{padding:8px 12px 40px}
  .nav{height:60px;margin:8px 0 16px}
  .nav .in{padding:0 10px;grid-template-columns:1fr auto 1fr}
  .nl{gap:14px;padding-left:2px}.lk{font-size:15px;padding:20px 0;gap:5px}.lk svg{width:15px;height:15px}
  .nr{padding-right:0}
  .logo{height:40px}
  .nr .dc{width:38px;height:38px}.nr .dc svg{width:22px;height:22px}
  .search{height:44px}
  .tabs{align-items:stretch;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:6px;margin:12px 0}
  .tabs button{flex:0 0 calc(20% - 4px);padding:9px 0 12px;font-size:12px;gap:5px}
  .tabs .ic{width:36px;height:36px}.tabs.open .dd{max-height:56px}
  .tabs .lf{display:none}.tabs .ls{display:block}
  .panel{padding:18px 8px 22px}
  .ttl{font-size:24px}
  .stage{gap:6px;min-height:300px}
  .p1{width:34%;height:285px}.p2{width:31%;height:252px}.p3{width:28%;height:224px}
  .pod .nm{font-size:16px;padding:10px 4px 0}.base .n{font-size:40px}
  .list{max-width:100%}
  .row{grid-template-columns:26px 34px minmax(0,1fr) auto;gap:8px;padding:8px 10px 8px 6px}
  .row .hd{width:34px;height:34px}.row .rt s:not(.tp){display:none}
  .foot{gap:10px}.tog button{padding:7px 11px}
  .mc{padding:22px 14px 18px}
  .mc .grid{grid-template-columns:1fr 1fr;gap:6px}
}
@media (max-width:360px){.tabs button{font-size:11px}.nl{gap:10px}.lk{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fxbg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.panel>*:not(.fxbg){position:relative;z-index:1}
.fxbg i.tw{position:absolute;border-radius:50%;background:#fff;opacity:0;animation:tw var(--t) ease-in-out var(--w) infinite}
.star{width:190px;height:3px;background:linear-gradient(90deg,transparent,rgba(110,215,255,.65) 65%,#fff)}
.star::after{right:-3px;top:-3px;width:9px;height:9px}
.md{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(3,6,14,.75);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.md.on{opacity:1;pointer-events:auto}
.mc{position:relative;width:min(440px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#1a2b63,#14204f);padding:26px 20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.md.on .mc{transform:none}
.mc .pose{margin:0 auto}.mc .hd{margin:0 auto;border-radius:14px;overflow:hidden}
.mc h3{margin:10px 0 2px;text-align:center;font:700 32px var(--px)}
.mc .meta{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.mc .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc .g{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:#192760;font-size:13px}
.mc .g span{color:var(--muted)}.mc .g .ic-s{width:30px;height:30px}.mc .g .tier{color:var(--k)}
.mc .link{display:flex;justify-content:center;margin-top:16px}
.mc .up{display:grid;gap:8px}.mc .up div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#192760;font-size:14px}.mc .up small{display:block;margin:0 0 2px;text-align:left}
.x{position:absolute;right:12px;top:8px;border:0;background:none;color:var(--muted);font-size:28px;line-height:1;cursor:pointer}.x:hover{color:var(--text)}
.dc{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:#fff;background:#5865f2;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 6px 18px rgba(88,101,242,.5);transition:transform .2s,filter .2s}
.dc svg{width:26px;height:26px}.dc:hover{transform:translateY(-2px) scale(1.06);filter:brightness(1.12)}.dc:active{transform:scale(.95)}
.nr{padding-right:0}
.lshort{display:none}

/* ---------- home hub + tournaments ---------- */
.view[hidden]{display:none}
.view.enter{animation:swapin .5s cubic-bezier(.2,.9,.3,1) both}
.hub{display:grid;gap:18px;margin-top:4px}
.hc{position:relative;display:block;height:300px;border-radius:24px;overflow:hidden;text-decoration:none;color:#fff;isolation:isolate;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 44px rgba(0,0,0,.32);transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s}
.hc:hover{transform:translateY(-5px);box-shadow:0 26px 56px rgba(0,0,0,.4)}
.hc:active{transform:scale(.985)}
.hc .bg{position:absolute;inset:0;z-index:-2}
.hc::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:30%;z-index:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.hc:hover::after{left:120%}
.hc .txt{position:absolute;left:34px;bottom:32px;z-index:3}
.hc .txt>svg{display:block;width:40px;height:40px;margin-bottom:12px;fill:currentColor}
.hc h3{margin:0;font:700 46px/1 var(--px);letter-spacing:.2px}
.hc p{margin:8px 0 0;font:600 16px var(--b);opacity:.92}
.hc .go{position:absolute;right:22px;top:22px;z-index:3;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);transition:transform .3s,background .3s}
.hc .go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hc:hover .go{transform:translateX(4px);background:rgba(255,255,255,.28)}
.hc .art{position:absolute;right:0;top:0;bottom:0;width:58%;z-index:1}
.hc .art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hc-tour .bg{background:radial-gradient(70% 90% at 78% 40%,rgba(236,120,255,.55),transparent 65%),linear-gradient(135deg,#2a1478 0%,#5a24b8 52%,#8e34d6 100%)}
.hc-tier{color:#1b1300}
.hc-tier .bg{background:radial-gradient(60% 80% at 80% 20%,rgba(255,255,255,.55),transparent 65%),linear-gradient(135deg,#ffe45c 0%,#ffc21a 50%,#ff9f0a 100%)}
.hc-tier .go{background:rgba(27,19,0,.12);border-color:rgba(27,19,0,.28)}
.hc-tier .txt>svg{fill:#1b1300}
.fl{animation:flt 5s ease-in-out infinite}.fl2{animation:flt 5.8s ease-in-out -2s infinite}.fl3{animation:flt 6.4s ease-in-out -4s infinite}
@keyframes flt{50%{transform:translateY(-9px)}}
.hop{animation:hop 2.6s cubic-bezier(.3,0,.4,1) infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-12px)}}
.hc:hover .hop{animation-duration:1.1s}
.sp{transform-box:fill-box;transform-origin:center;animation:tw2 2.6s ease-in-out infinite}
@keyframes tw2{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.hc:hover .c1{transform:translate(-8px,-6px) rotate(-12deg)}.hc:hover .c2{transform:translate(0,-4px) rotate(-7deg)}.hc:hover .c3{transform:translate(8px,-8px) rotate(6deg)}
.pc{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-box:fill-box;transform-origin:50% 100%}
.sub{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.sub svg{width:44px;height:44px;fill:var(--gold);filter:drop-shadow(0 0 12px rgba(255,198,26,.5))}
.sub h2{margin:0;font:700 40px/1 var(--px)}.sub p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tl{display:grid;gap:12px}
.tc{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;padding:20px 22px;border:1px solid rgba(180,120,255,.35);border-radius:18px;background:linear-gradient(135deg,rgba(90,36,184,.42),rgba(20,32,79,.9));animation:swapin .45s both}
.tc h4{margin:0;font:700 26px/1.1 var(--px)}
.tc .mt{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tc .mt span{padding:3px 10px;border-radius:99px;font:700 13px var(--px);border:1px solid var(--line);background:rgba(255,255,255,.06);color:#d9defc}
.tc .mt .lv{color:#06260f;background:#4be38a;border-color:transparent}
.tc .mt .up{color:#2a1d00;background:var(--gold);border-color:transparent}
.tc .ds{grid-column:1/-1;color:var(--muted);font-size:14px;margin:2px 0 0}
.tc .cta{min-width:0;padding:14px 26px;font-size:18px}
.none{display:grid;justify-items:center;gap:6px;text-align:center;padding:46px 20px;border:1px dashed rgba(180,120,255,.4);border-radius:22px;background:radial-gradient(60% 90% at 50% 0,rgba(142,52,214,.28),transparent 70%),rgba(20,32,79,.6)}
.none svg.big{width:92px;height:92px;filter:drop-shadow(0 0 22px rgba(176,96,255,.55))}
.none h4{margin:6px 0 0;font:700 30px var(--px)}.none p{margin:0;color:var(--muted);max-width:420px}
.none .dc{margin-top:12px;width:auto;height:auto;border-radius:999px;padding:12px 22px;gap:10px;display:inline-flex;text-decoration:none;font:700 17px var(--px)}.none .dc svg{width:22px;height:22px}
@media (max-width:760px){
  .hc{height:236px;border-radius:20px}.hc .txt{left:22px;bottom:22px}.hc h3{font-size:36px}.hc p{font-size:14px}.hc .txt>svg{width:34px;height:34px;margin-bottom:9px}

/* players.json format (put it next to this page); players show in list order until they have tiers.
   Tournaments: "tournaments":[{"name":"Sword Showdown","status":"Live","date":"Oct 30","mode":"Sword","reward":"HT3 tier","description":"...","link":"https://discord.gg/..."}] (empty list = "No active tournaments")
   [{"name":"Rnickname","region":"NA","tiers":{"crystal":"HT1","sword":"LT2"}}, ...]
   Or {"players":[...],"updates":[{"date":"Oct 23","text":"..."}]}. Tier keys: crystal, sword, axe, mace, nethpot, uhc, dsmp, smp. Optional: "uuid", "skin" (path or URL to the skin PNG, e.g. "skins/Rnickname.png"), "skinHash" (the hash from the NameMC skin page URL). */
var MODES=[["overall","Overall"],["crystal","Crystal"],["sword","Sword"],["axe","Axe"],["mace","Mace"],["nethpot","Netherite pot"],["uhc","UHC"],["dsmp","Diamond SMP"],["smp","SMP"]];
var TIERS=["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];
var PTS=[70,55,46,32,25,13,7,4,2,1];
var DEFAULT=[{name:"Rnickname"},{name:"oLineage",uuid:"a471c5ef-43a8-4d46-a215-62a01e8e4471",skinHash:"2b4543645ddec2c50ace58f9df7a154057b8fe2d6e766fb8f6a0a48b168c9344"},{name:"sssap"},{name:"itzrealsasuke"}];
var REG=["All","NA","EU","AS"];
var players=[],updates=[],tours=[],mode="overall",region="All",query="",full=false;
var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(list){return list.map(function(p,i){
  var tiers={},tot=0,has=false;
  for(var k in (p.tiers||{})){var ix=TIERS.indexOf(String(p.tiers[k]).toUpperCase());
    if(ix>-1&&k!=="overall"&&MODES.some(function(m){return m[0]===k})){tiers[k]=ix;tot+=PTS[ix];has=true}}
  var seed=0;for(var j=0;j<p.name.length;j++)seed=(seed*31+p.name.charCodeAt(j))>>>0;
  return{name:p.name,id:p.uuid||p.name,skin:p.skin||"",hash:p.skinHash||"",region:p.region||"",tiers:tiers,total:tot,has:has,order:i,seed:seed};
})}

/* ---------- character: poses shared by the drawn fallback and the real-skin canvas ---------- */
var POSES={victory:{l:160,r:-160,wide:1},crossed:{l:-70,r:70},wave:{l:5,r:-155},idle:{l:0,r:0}};
var SKINS=["#c68a64","#e0ac82","#8d5a3a","#f1c9a0","#a9704a"],HAIR=["#3a2412","#1c1c1c","#7a4a1c","#c9a227","#5b2b1a","#2a3d66"],EYES=["#3b4cc0","#2c7a3a","#5a3a1c"],PANTS=["#2b3a67","#3a3a42","#4a3a28","#27495a"];
var FACE=["HHHHHHHH","HHHHHHHH","HSSSSSSH","SSSSSSSS","SWESSEWS","SSSNNSSS","SSMMMMSS","SSSSSSSS"];
function drawn(p,pose,head){
  var sd=p.seed,sk="#b98a6a",shirt="#17a3a3",pants="#3a3f9c",P=POSES[pose]||POSES.idle,r="";
  var col={H:"#3b2a1a",S:sk,W:"#fff",E:"#5a3fa8",N:"rgba(0,0,0,.18)",M:"rgba(70,20,20,.55)"};
  function R(x,y,w,h,f){r+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"/>'}
  function arm(x,px,deg){r+='<g transform="rotate('+deg+' '+px+' 9)">';R(x,8,4,5,shirt);R(x,13,4,7,sk);R(x,8,4,1,"rgba(255,255,255,.14)");r+='</g>'}
  if(!head){
    var lx=P.wide?3:4,rx=P.wide?9:8;
    R(lx,20,4,12,pants);R(rx,20,4,12,pants);R(rx,20,4,12,"rgba(0,0,0,.18)");R(lx,29,4,3,"#17181d");R(rx,29,4,3,"#17181d");
    R(4,8,8,12,shirt);R(4,8,8,1,"rgba(255,255,255,.14)");R(7,8,2,1,sk);R(4,19,8,1,"rgba(0,0,0,.2)");
    arm(0,2,P.l);arm(12,14,P.r);
  }
  FACE.forEach(function(row,y){for(var x=0;x<8;x++){var c=row[x];if(c==="N"||c==="M")R(4+x,y,1,1,sk);R(4+x,y,1,1,col[c])}});
  return '<svg viewBox="'+(head?"4 0 8 8":"-5 -5 26 37")+'" shape-rendering="crispEdges" role="img" aria-label="'+esc(p.name)+'">'+r+'</svg>';
}
function isSlim(img){
  if(img.slim!==undefined)return img.slim;
  if(img.height<64)return false;
  try{var t=document.createElement("canvas");t.width=t.height=64;var x=t.getContext("2d");x.drawImage(img,0,0);
    return x.getImageData(55,22,1,1).data[3]===0&&x.getImageData(47,54,1,1).data[3]===0}catch(e){return false}

/* Look the player up first so we get their real skin file; the by-name skin sites hand back a default Steve when they can't match a name. */
function lookup(id){
  return fetch("https://mcprofiles.me/api/player/"+encodeURIComponent(id)).then(function(r){return r.text()}).then(function(t){
    var m=t.match(/textures\.minecraft\.net\/texture\/([0-9a-f]{20,})/i);
    if(m)return["https://textures.minecraft.net/texture/"+m[1]];
    throw 0;
  }).catch(function(){return lookupDb(id)});
}
function lookupDb(id){
  return fetch("https://playerdb.co/api/player/minecraft/"+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(j){
    var pl=j&&j.success&&j.data&&j.data.player;
    if(!pl)return"none";
    var u=[],raw=String(pl.raw_id||pl.id||"").replace(/-/g,"");
    if(pl.skin_texture)u.push(String(pl.skin_texture).replace(/^http:/,"https:"));
    if(raw)u.push("https://crafatar.com/skins/"+raw,"https://mc-heads.net/skin/"+raw);
    return u;
  }).catch(function(){return null});

function loadSkin(id,url,hash){
  var key=id+"|"+url+"|"+hash;

  var n=encodeURIComponent(id),direct=[];

  if(hash)direct.push("https://textures.minecraft.net/texture/"+encodeURIComponent(hash),"https://namemc.com/texture/"+encodeURIComponent(hash)+".png");
  return skinCache[key]=(direct.length?tryLoad(direct):Promise.resolve(null)).then(function(im){
    if(im)return im;
    return lookup(id).then(function(r){
      if(r==="none")return null;                       /* no such account: show Steve */
      if(r&&r.length){return tryLoad(r)}

    });

var SHORT={overall:"Overall",crystal:"Crystal",sword:"Sword",axe:"Axe",mace:"Mace",nethpot:"NethPot",uhc:"UHC",dsmp:"D. SMP",smp:"SMP"};
function icon(k,c){return '<span class="'+(c||"ic-s")+'" aria-hidden="true">'+ICONS[k]+'</span>'}
/* ---------- ui ---------- */
function replay(){["stage","list","rule"].forEach(function(id){var e=document.getElementById(id);e.classList.remove("swap");void e.offsetWidth;e.classList.add("swap")})}
function moveInd(){}
var tabs=document.getElementById("tabs");
MODES.forEach(function(m){
  var b=document.createElement("button");b.type="button";b.innerHTML='<span class="lb lf">'+(m[0]==="nethpot"?"Netherite Pot":m[1])+'</span><span class="lb ls">'+SHORT[m[0]]+'</span><span class="dd">'+icon(m[0],"ic")+'</span>';b.setAttribute("aria-label",m[1]);b.setAttribute("role","tab");b.setAttribute("aria-selected",m[0]===mode);
  b.onclick=function(){tabs.classList.add("open");mode=m[0];full=false;[].forEach.call(tabs.querySelectorAll("button"),function(x){x.setAttribute("aria-selected",x===b)});render();replay()};
  tabs.appendChild(b);
});
var rg=document.getElementById("regions");
REG.forEach(function(r){
  var b=document.createElement("button");b.type="button";b.textContent=r;b.setAttribute("aria-pressed",r===region);
  b.onclick=function(){region=r;[].forEach.call(rg.children,function(x){x.setAttribute("aria-pressed",x===b)});render()};
  rg.appendChild(b);
});
document.getElementById("q").oninput=function(e){query=e.target.value.trim().toLowerCase();render()};
document.getElementById("more").onclick=function(){full=!full;render()};

/* load players.json, fall back to the top 3 */
var wait=new Promise(function(res){setTimeout(function(){res(null)},1500)});
Promise.race([fetch("players.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),wait]).then(function(list){
  var arr=Array.isArray(list)?list:(list&&list.players),ups=list&&!Array.isArray(list)&&list.updates;
  tours=list&&!Array.isArray(list)&&Array.isArray(list.tournaments)?list.tournaments:[];updates=Array.isArray(ups)?ups:[];players=norm(Array.isArray(arr)?arr:DEFAULT);buildFx();
  render();route(true);moveInd();setTimeout(moveInd,80);setTimeout(shoot,900);
});

function fillPod(){
  var st={name:"Steve",id:"steve",skin:"",hash:"",seed:7},big=window.innerWidth>760;
  var cfg=[["crossed",big?118:70,big?58:38,2],["victory",big?150:92,big?82:54,1],["wave",big?104:62,big?40:26,3]];
  document.getElementById("hcPod").innerHTML=cfg.map(function(c){return '<div class="col">'+figure(st,c[0],c[1])+'<div class="blk" style="height:'+c[2]+'px">'+c[3]+'</div></div>'}).join("");
}
fillPod();window.addEventListener("resize",fillPod);
var curView="";
function route(force){
  var h=(location.hash||"").replace("#","").toLowerCase(),v=h==="tierlist"?"vTier":h==="tournaments"?"vTour":"vHome";
  if(v===curView&&!force)return;
  var changed=v!==curView;curView=v;
  ["vHome","vTour","vTier"].forEach(function(id){var e=document.getElementById(id);e.hidden=id!==v;e.classList.remove("enter")});
  var el=document.getElementById(v);void el.offsetWidth;if(changed)el.classList.add("enter");
  document.getElementById("home2").classList.toggle("on",v==="vHome");
  if(v==="vTier")render();if(v==="vTour")renderTours();
  if(changed)window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){route()});
route(true);
window.addEventListener("load",moveInd);
window.addEventListener("resize",function(){moveInd();render()});
